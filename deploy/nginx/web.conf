# nginx inside the "web" container: serves the SPA and proxies /api to the backend container.

# Keep the admin subdomain out of search engines (an empty value sends no header).
map $host $robots_tag {
    ~^admin\. "noindex, nofollow";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Pass through the client IP and scheme set by the host nginx.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Firebase Auth handler served from our own domain, so the Google sign-in popup shows
    # atelierdevs.tech instead of the firebaseapp.com domain. Requires
    # VITE_FIREBASE_AUTH_DOMAIN=atelierdevs.tech and https://atelierdevs.tech/__/auth/handler
    # registered as a redirect URI on the Google OAuth client.
    location /__/ {
        proxy_pass https://ats-resume-grader.firebaseapp.com;
        proxy_set_header Host ats-resume-grader.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_ssl_name ats-resume-grader.firebaseapp.com;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $robots_tag;
        try_files $uri /index.html;
    }
}
