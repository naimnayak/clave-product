# Host nginx site for Clave. Copy to /etc/nginx/sites-available/atelierdevs.tech and symlink into
# sites-enabled. Certbot adds the 443/SSL block and the HTTP->HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name atelierdevs.tech www.atelierdevs.tech;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
