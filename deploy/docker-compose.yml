# Clave production stack. Run from this directory: docker compose up -d --build
# Variables come from deploy/.env (copy .env.example). Backend settings come from backend/.env.
name: clave

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Cap the WiredTiger cache so MongoDB leaves RAM for the other apps on this server.
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    # These override the matching keys in backend/.env.
    environment:
      APP_ENV: production
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ALLOWED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      WEB_BASE_URL: https://${DOMAIN}
      ENFORCE_PLAN_LIMITS: "true"
      RATE_LIMIT_STORAGE_URI: memory://
    volumes:
      - ../backend/secrets:/app/secrets:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    restart: unless-stopped
    # Localhost only; the host nginx terminates HTTPS and proxies here. 3020 is free on the server.
    ports:
      - "127.0.0.1:${WEB_PORT:-3020}:80"
    depends_on:
      - backend
    networks: [internal]

volumes:
  mongo-data:

networks:
  internal:
